
name: Release Pipeline

on:
  push:
    tags:
      - 'v*.*.*'
      - '!v*-beta*'

  pull_request:
    types: [opened, synchronize, closed]

  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check release
        run: echo "Checking release..."

      - name: Deploy
        if: startsWith(github.ref, 'refs/tags/v') || github.event.pull_request.merged == true
        run: echo "Deploy successful!"
