
name: Feature CI

on:
  push:
    branches:
      - 'feature/**'
      - '!feature/wip'
    paths:
      - 'src/**'

  pull_request:
    branches:
      - main
    paths:
      - 'src/**'

jobs:
  feature-test:
    runs-on: ubuntu-latest

    steps:
      - name: Show commit hash
        run: echo "Commit SHA ${{ github.sha }}"

      - name: Show branch
        run: echo "Branch ${{ github.ref }}"
